# ENERGIEVERBRUIKMAAND{YYYY}TABV{N} - Monthly smart meter energy data
# Gas and electricity delivery/feed-back per month for dwellings with smart meters
# One record per dwelling (object), keyed by SOORTOBJECTNUMMER + RINOBJECTNUMMER
entity: object
spine_table: obj

columns:
  # ---- Identifiers ----
  - name: SOORTOBJECTNUMMER
    source: spine.obj.SOORTOBJECTNUMMER
    codelist: SOORTOBJECTNUMMER
    label: Herkomst identificatienummer object

  - name: RINOBJECTNUMMER
    source: spine.obj.RINOBJECTNUMMER

  - name: GASLEV01
    source: spine.obj.GASLEV01
    label: Gaslevering in m3 in januari

  - name: GASLEV02
    source: spine.obj.GASLEV02
    label: Gaslevering in m3 in februari

  - name: GASLEV03
    source: spine.obj.GASLEV03
    label: Gaslevering in m3 in maart

  - name: GASLEV04
    source: spine.obj.GASLEV04
    label: Gaslevering in m3 in april

  - name: GASLEV05
    source: spine.obj.GASLEV05
    label: Gaslevering in m3 in mei

  - name: GASLEV06
    source: spine.obj.GASLEV06
    label: Gaslevering in m3 in juni

  - name: GASLEV07
    source: spine.obj.GASLEV07
    label: Gaslevering in m3 in juli

  - name: GASLEV08
    source: spine.obj.GASLEV08
    label: Gaslevering in m3 in augustus

  - name: GASLEV09
    source: spine.obj.GASLEV09
    label: Gaslevering in m3 in september

  - name: GASLEV10
    source: spine.obj.GASLEV10
    label: Gaslevering in m3 in oktober

  - name: GASLEV11
