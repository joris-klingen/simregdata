# ENERGIEVERBRUIK{YYYY}TABV{N} - Energieverbruik particuliere woningen
# Energy consumption of private dwellings: gas, electricity, solar PV, heating
# One record per dwelling (object), keyed by SOORTOBJECTNUMMER + RINOBJECTNUMMER
entity: object
spine_table: obj

columns:
  # ---- Identifiers ----
  - name: SOORTOBJECTNUMMER
    source: spine.obj.SOORTOBJECTNUMMER
    codelist: SOORTOBJECTNUMMER
    label: Herkomst identificatienummer object

  - name: RINOBJECTNUMMER
    source: spine.obj.RINOBJECTNUMMER

  # ---- Dwelling type (empty since 2019) ----
  - name: WONINGT
    value: " "

  - name: WOONR
    value: " "

  # ---- District heating (85140NED share per dwelling type and construction year) ----
  - name: STADSW
    source: spine.obj.STADSW
    codelist: STADSW
    label: Stadsverwarming aanwezig

  # ---- Gas delivery in m3 (dwelling characteristics, 85140NED; level 81528NED) ----
  - name: GAS
    source: spine.obj.GAS
    label: Gaslevering in m3

  # ---- Electricity delivery in kWh (dwelling characteristics and solar panels, 85140NED) ----
  - name: ELEK
    source: spine.obj.ELEK
    label: Elektriciteitsverbruik in kWh

  # ---- Gas determination method ----
  - name: GASBRON
    random_categorical:
      values: ["BW", "IM", "LG", "NT", "SW", "TP", "WG", "WP", "ZW"]
      probs:  [0.01, 0.05, 0.02, 0.001, 0.05, 0.02, 0.82, 0.02, 0.009]
    codelist: GASBRON
    label: Bepalingsmethode aardgaslevering

  # ---- Electricity determination method ----
  - name: ELEKBRON
    random_categorical:
      values: ["BW", "IM", "LG", "WG", "ZW"]
      probs:  [0.01, 0.05, 0.02, 0.91, 0.01]
    codelist: ELEKBRON
    label: Bepalingsmethode elektriciteitslevering

  # ---- Electricity fed back to the grid in kWh (dwellings with solar panels only) ----
  - name: ELEKTERUG
    source: spine.obj.ELEKTERUG
    label: Teruglevering elektriciteit in kWh

  # ---- Net electricity in kWh (ELEK - ELEKTERUG) ----
  - name: ELEKNETTO
    source: spine.obj.ELEKNETTO
    label: Netto elektriciteitslevering in kWh

  # ---- Standard annual gas use, temperature corrected, in m3 ----
  - name: GASSJV
    source: spine.obj.GASSJV
    label: Standaard jaarverbruik aardgas in m3

  # ---- Estimated heat supply in GJ (district heating only) ----
  - name: WARMTESCHATTING
    source: spine.obj.WARMTESCHATTING
    label: Inschatting warmtelevering in GJ

  # ---- Solar panels present (85140NED share per dwelling type, floor area, occupants) ----
  - name: ZONPV
    source: spine.obj.ZONPV
    codelist: ZONPV
    label: Aanwezigheid zonnestroominstallatie

  # ---- Solar PV capacity (kWp) ----
  - name: ZONVERMOGEN1JAN
    source: spine.obj.ZONVERMOGEN1JAN
    label: Zonvermogen op 1 januari in kWp

  - name: ZONVERMOGEN31DEC
    source: spine.obj.ZONVERMOGEN31DEC
    label: Zonvermogen op 31 december in kWp

  # ---- Solar PV source ----
  - name: ZONPVBRON
    random_categorical:
      values: ["1", "2", "3", "4"]
      probs:  [0.20, 0.05, 0.10, 0.65]
    codelist: ZONPVBRON
    label: Bron waarop ZONPV is gebaseerd

  # ---- Main heating type (district heating, all-electric or central heating) ----
  - name: HOOFDVERWARMING31DEC
    source: spine.obj.HOOFDVERWARMING31DEC
    codelist: HOOFDVERWARMING31DEC
    label: Hoofdverwarmingstype

  # ---- Dwelling occupancy profiles ----
  - name: WONINGBEWONING10PROFIELEN
    random_categorical:
      values: ["-1", "00", "01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "19"]
      probs:  [0.08, 0.02, 0.08, 0.10, 0.08, 0.06, 0.08, 0.10, 0.10, 0.12, 0.08, 0.06, 0.04]
    codelist: WONINGBEWONING10PROFIELEN
    label: Woningbewoning 10 profielen

  - name: KBHOOFDVERWARMING31DEC
    source: spine.obj.KBHOOFDVERWARMING31DEC
    codelist: KBHOOFDVERWARMING31DEC
    label: Hoofdverwarmingstype (KB-methode)

