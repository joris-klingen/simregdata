# ENERGIEVERBRUIK dataset manifest
# Energy consumption of private dwellings
# CBS name patterns:
#   ENERGIEVERBRUIK{YYYY}TABV{N}      — annual totals (2004-2024)
#   ENERGIEVERBRUIKMAAND{YYYY}TABV{N} — monthly smart meter data (2021-2024)
# One record per dwelling (object), keyed by SOORTOBJECTNUMMER + RINOBJECTNUMMER

dataset_id: energieverbruik
label: Energieverbruik particuliere woningen
spine_builder: generic

entities:
  person:
    id_col: RINPERSOON
    id_width: 9
    id_prefix_col: RINPERSOONS

files:
  energieverbruik:
    cbs_name: ENERGIEVERBRUIK
    entity: object
    columns_file: energieverbruik.yaml
    tab_suffix: true
  energieverbruikmaand:
    cbs_name: ENERGIEVERBRUIKMAAND
    entity: object
    columns_file: energieverbruikmaand.yaml
    tab_suffix: true
