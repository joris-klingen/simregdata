# WoonbaseEKWoonruimtenWV - Extra Kenmerken Woonruimten Welvaart
# Dwelling-level income and wealth characteristics
# CBS name: WoonbaseEKWoonruimtenWV{YYYY}V{N}
entity: object
spine_table: obj

columns:
  - name: SOORTOBJECTNUMMER
    source: spine.obj.SOORTOBJECTNUMMER

  - name: RINOBJECTNUMMER
    source: spine.obj.RINOBJECTNUMMER

  # Aandachtsgroep inkomensafhankelijk huurbeleid (woningniveau)
  - name: "AGIAHWONING{sfx}"
    suffixes: ["1JAN", "31DEC"]
    random_categorical:
      values: ["1", "2", "3"]
      probs:  [0.30, 0.20, 0.50]
    codelist: AGIAHWONING
    label: Aandachtsgroep IAH woningniveau

  # Belastbaar inkomen woningniveau
  - name: "BELIWONING{sfx}"
    suffixes: ["1JAN", "31DEC"]
    random_numeric:
      distribution: normal
      mean: 55000
      sd: 35000
      round: 0

  # Besteedbaar inkomen woningniveau
  - name: "BESTINKWONING{sfx}"
    suffixes: ["1JAN", "31DEC"]
    random_numeric:
      distribution: normal
      mean: 40000
      sd: 20000
      round: 0

  # Populatie IIV woningniveau
  - name: "POPIIVWONING{sfx}"
    suffixes: ["1JAN", "31DEC"]
    random_categorical:
      values: ["10", "11", "20", "21", "22", "70"]
      probs:  [0.75, 0.05, 0.05, 0.02, 0.03, 0.10]
    codelist: POPIIVWONING
    label: Populatie IIV woningniveau

  # Vrij opneembaar vermogen woningniveau
  - name: "VROMWONING{sfx}"
    suffixes: ["1JAN", "31DEC"]
    random_numeric:
      distribution: normal
      mean: 30000
      sd: 40000
      round: 0

  # Vermogen woningniveau
  - name: "W1000VERWONING{sfx}"
    suffixes: ["1JAN", "31DEC"]
    random_numeric:
      distribution: uniform
      min: 0
      max: 500000
      round: 0
