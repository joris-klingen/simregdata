# VERKEERSPRESTATIE - traffic performance of passenger cars
# CBS name: VERKEERSPRESTATIE{YYYY}TABV{N}
# One row per active passenger car of a natural person per year
# Calibrated from CBS StatLine 85404NED via rdw_update_params()
entity: person
spine_table: vp

columns:
  - name: RINKENTEKEN
    source: spine.vp.RINKENTEKEN

  - name: RinpersoonsVP
    source: spine.vp.RINPERSOONS
    codelist: RINPERSOONS_RDW
    label: Oorsprong persoon-id

  - name: RinpersoonVP
    source: spine.vp.RINPERSOON

  # Weights vary around 1 (higher in 2010-2011, sample-based); must be applied
  - name: VPGEWICHT
    random_numeric:
      distribution: normal
      mean: 1.0
      sd: 0.15
      min: 0.5
      max: 3.0
      round: 5

  # Most vehicles active full year; ~10% new/scrapped mid-year
  - name: VPDGNWEG
    random_categorical:
      numeric: true
      values: [365, 366, 180, 90, 30, 270, 330]
      probs:  [0.82, 0.05, 0.04, 0.03, 0.02, 0.02, 0.02]

  # Year-specific mean annual km from 85404NED
  - name: VPJAARKM
    random_numeric:
      distribution: normal
      mean: 13000
      sd: 6000
      mean_from_params: jaarkm_mean
      sd_from_params: jaarkm_sd
      min: 0
      max: 100000
      round: 2
