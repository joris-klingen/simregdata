# VERKEERSPRESTATIE - traffic performance of passenger cars
# CBS name: VERKEERSPRESTATIE{YYYY}TABV{N}
# One row per vehicle (license plate) per year
# Calibrated from CBS StatLine 85404NED via rdw_update_params()
entity: person
spine_table: pers

columns:
  - name: RINKENTEKEN
    source: spine.pers.RINKENTEKEN

  - name: RinpersoonsVP
    random_categorical:
      values: ["K", "R", "S"]
      probs:  [0.02, 0.96, 0.02]
    codelist: RINPERSOONS_RDW
    label: Oorsprong persoon-id

  - name: RinpersoonVP
    source: spine.pers.RINPERSOON

  # Post-2012 register data: most weights ~1.0 (full population)
  - name: VPGEWICHT
    random_categorical:
      values: ["1.0", "1.0", "1.0", "1.1", "1.2", "1.5", "2.0"]
      probs:  [0.85, 0.05, 0.03, 0.03, 0.02, 0.01, 0.01]

  # Most vehicles active full year; ~10% new/scrapped mid-year
  - name: VPDGNWEG
    random_categorical:
      values: ["365", "366", "180", "90", "30", "270", "330"]
      probs:  [0.82, 0.05, 0.04, 0.03, 0.02, 0.02, 0.02]

  # Year-specific mean annual km from 85404NED
  - name: VPJAARKM
    random_numeric:
      distribution: normal
      mean: 13000
      sd: 6000
      mean_from_params: jaarkm_mean
      sd_from_params: jaarkm_sd
      min: 0
      max: 100000
      round: 2
