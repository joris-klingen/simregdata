# RDWNPACT kentekens - vehicle characteristics per license plate
# CBS name: RDWNPACT{YYYY}TABV{N}
# One row per vehicle per person
# Calibrated from CBS StatLine 85237NED + 85236NED via rdw_update_params()
# Columns with from_params use year-specific distributions from params.yaml
# Columns with stable_per use deterministic hashing for year-to-year stability
entity: person
spine_table: pers

columns:
  # owner origin, owner id, vehicle type, owner type and colour are fixed
  # per plate on the RDW spine (R/rdw_vehicles.R)
  - name: RINPERSOONS
    source: spine.pers.RINPERSOONS
    codelist: RINPERSOONS_RDW
    label: Oorsprong persoon-id

  - name: RINPERSOON
    source: spine.pers.RINPERSOON

  - name: RINKENTEKEN
    source: spine.pers.RINKENTEKEN

  # Year-specific color distribution from 85237NED
  - name: KLEURCODEVRTG
    source: spine.pers.KLEURCODEVRTG
    codelist: KLEURCODE
    label: Kleur voertuig

  - name: EERSTETOELDAT1VRTG
    stable_per: RINKENTEKEN
    random_categorical:
      from_params: bouwjaar_p
      # Fallback:
      values: ["2000","2005","2010","2015","2020"]
      probs:  [0.10, 0.15, 0.20, 0.30, 0.25]

  - name: SRTREFVRTG
    source: spine.pers.SRTREFVRTG
    codelist: SRTREF
    label: Soort referentie

  # 85236NED type shares; part of the passenger cars dropped or in business stock
  - name: VRTGSOORT
    source: spine.pers.VRTGSOORT
    codelist: VRTGSOORT
    label: Soort voertuig

  - name: BRANDSTCODECORVRTG
    stable_per: RINKENTEKEN
    random_categorical:
      from_params: brandstof_p
      # Fallback (approximate 2023):
      values: ["1", "2", "3", "4", "5", "A", "B"]
      probs:  [0.709, 0.096, 0.011, 0.107, 0.001, 0.020, 0.055]
    codelist: BRANDSTOF
    label: Brandstoftype

  # Year-specific weight from 85237NED weight class distribution
  - name: MASSALEEGCORVRTG
    stable_per: RINKENTEKEN
    not_for: {column: VRTGSOORT, values: ["7", "Q"]}
    random_numeric:
      distribution: normal
      mean: 1350
      sd: 350
      mean_from_params: gewicht_mean
      sd_from_params: gewicht_sd
      min: 500
      max: 3500
      round: 0

  - name: MAXLAADVERMCORVRTG
    stable_per: RINKENTEKEN
    only_for: {column: VRTGSOORT, values: ["1", "2", "4", "8", "9"]}
    random_numeric:
      distribution: uniform
      min: 0
      max: 3000
      round: 0

  - name: AANTALCYLCORVRTG
    stable_per: RINKENTEKEN
    not_for: {column: VRTGSOORT, values: ["0", "8", "9"]}
    random_categorical:
      numeric: true
      values: ["0", "1", "2", "3", "4", "5", "6", "8", "10", "12"]
      probs:  [0.10, 0.01, 0.02, 0.08, 0.55, 0.02, 0.12, 0.08, 0.01, 0.01]

  - name: CYLININHOUDCORVRTG
    stable_per: RINKENTEKEN
    only_for: {column: VRTGSOORT, values: ["7", "Q"]}
    random_numeric:
      distribution: normal
      mean: 1600
      sd: 600
      min: 0
      max: 6000
      round: 0

  - name: SOORTBROMFIETSCOR
    stable_per: RINKENTEKEN
    only_for: {column: VRTGSOORT, values: ["0"]}
    random_categorical:
      values: ["01", "02", "03", "04"]
      probs:  [0.40, 0.45, 0.05, 0.10]
    codelist: SOORTBROMFIETS
    label: Soort bromfiets
