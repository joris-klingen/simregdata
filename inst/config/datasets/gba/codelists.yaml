    Niet-gehuwd paar zonder kinderen: 2
    Gehuwd paar zonder kinderen: 3
    Niet-gehuwd paar met kinderen: 4
    Gehuwd paar met kinderen: 5
    Eenouderhuishouden: 6
    Overig huishouden: 7
    Institutioneel huishouden: 8
    Meerdere huishoudens: 9

