# Codelist mappings for GBA files
# Each entry has:
#   c2i:    character code -> integer (for spine -> labelled conversion)
#   labels: human-readable label -> integer (for haven::labelled attribute)

rinpersoons:
  c2i:
    "R": 1
  labels:
    Registratienummer: 1

geslacht:
  c2i:
    "1": 1
    "2": 2
  labels:
    Man: 1
    Vrouw: 2

burgerlijkestaat:
  c2i:
    "O": 1
    "H": 2
    "S": 3
    "W": 4
    "P": 5
  labels:
    Ongehuwd: 1
    Gehuwd: 2
    Gescheiden: 3
    Verweduwd: 4
    Partnerschap: 5

geboorteland:
  c2i:
    "6030": 6030
    "7076": 7076
    "5010": 5010
    "5013": 5013
    "7024": 7024
    "6039": 6039
    "7003": 7003
    "0000": 0
  labels:
    Nederland: 6030
    Turkije: 7076
    Marokko: 5010
    Suriname: 5013
    Indonesie: 7024
    Duitsland: 6039
    Belgie: 7003
    Onbekend: 0

aantalouders:
  c2i:
    "0": 0
    "1": 1
    "2": 2
  labels:
    Geen ouders in buitenland: 0
    Een ouder in buitenland: 1
    Twee ouders in buitenland: 2

generatie:
  c2i:
    "0": 0
    "1": 1
    "2": 2
  labels:
    Autochtoon: 0
    Eerste generatie: 1
    Tweede generatie: 2

herkomstgroepering:
