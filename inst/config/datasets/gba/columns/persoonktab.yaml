# GBAPERSOONKTAB column spec
# Person demographics (limited) from the population register.
# One row per person ever registered in GBA/BRP.
# This is the "beperkt" (limited) version with only core demographics.
# See: https://www.cbs.nl/nl-nl/onze-diensten/maatwerk-en-microdata/microdata-zelf-onderzoek-doen/microdatabestanden/gbapersoonktab-persoonskenmerken-beperkt-in-de-brp

entity: person
spine_table: pers

columns:
  - name: RINPERSOONS
    source: spine.pers.RINPERSOONS
    codelist: rinpersoons

  - name: RINPERSOON
    source: spine.pers.RINPERSOON

  - name: GBAGESLACHT
    source: spine.pers.GBAGeslachtsAanduiding
    codelist: geslacht

  - name: GBAGEBOORTEJAAR
    source: spine.pers.GBAGeboorteJaar

  - name: GBAGEBOORTEMAAND
    random_numeric:
      distribution: uniform
      min: 1
      max: 12
      round: 0
    codelist: geboortemaand

  - name: GBAGEBOORTEDAG
    value: "01"
    label: Geboortedag (altijd 01 om beveiligingsredenen)
