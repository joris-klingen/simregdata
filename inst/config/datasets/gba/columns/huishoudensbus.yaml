# GBAHUISHOUDENSBUS column spec
# Household composition from GBA/BRP.
# One row per person, linking to household.

entity: person
spine_table: pers
# Period file: household membership only exists while a person is present, so
# restrict to the year's population (demographic entry/exit).
population_snapshot: true

columns:
  - name: RINPERSOONS
    source: spine.pers.RINPERSOONS
    codelist: rinpersoons

  - name: RINPERSOON
    source: spine.pers.RINPERSOON

  - name: HUESSION
    source: spine.pers.HUISHOUDNR

  - name: DAESSION
    source: spine.pers.DATUMAANVANGHH

  - name: TYPHH
    source: spine.pers.TYPHH
    codelist: typhh

  - name: PLESSION
    source: spine.pers.PLHH
    codelist: plhh

  - name: AANESSION
    source: spine.pers.AantalPersonenPerHuishouden

  - name: REFESSION
    source: spine.pers.REFPERSOONHH
