# BETAB dataset manifest
# Business register: economic activity and size class of businesses
# CBS name pattern: BE{YYYY}TABV{N}
# Links to SPOLIS via BEID = SBEID
# Only businesses appearing in the Polisadministratie

dataset_id: betab
label: Bedrijven (activiteit en grootteklasse)
spine_builder: generic

entities:
  person:
    id_col: RINPERSOON
    id_width: 9
    id_prefix_col: RINPERSOONS

files:
  betab:
    cbs_name: BE
    entity: person
    columns_file: betab.yaml
    tab_suffix: true
    key_columns: [BEID]
