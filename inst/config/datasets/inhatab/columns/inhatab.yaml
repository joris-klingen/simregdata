# INHATAB column spec
# Household income
# One row per household, annual data
# See: https://www.cbs.nl/nl-nl/onze-diensten/maatwerk-en-microdata/microdata-zelf-onderzoek-doen/microdatabestanden/inhatab-inkomen-van-huishoudens

entity: person
spine_table: pers

columns:
  # Household key (main earner identifies the household)
  - name: RINPERSOONSHKW
    value: "R"
    codelist: rinpersoons

  - name: RINPERSOONHKW
    source: spine.pers.RINPERSOONHKW

  # Household size (members present in the year)
  - name: INHAHL
    source: spine.pers.INHAHL

  # Household members with income
  - name: INHAHLMI
    random_numeric:
      distribution: uniform
      min: 1
      max: 4
      round: 0

  # Income vs European poverty line (%)
  - name: INHARMEUR
    random_numeric:
      distribution: uniform
      min: 1
      max: 300
      round: 0

  # Longitudinal European poverty
  - name: INHARMEURL
    random_numeric:
      distribution: uniform
      min: 1
      max: 300
      round: 0

  # Income vs low-income threshold (%)
  - name: INHARMLAG
    random_numeric:
      distribution: uniform
      min: 1
      max: 300
      round: 0

  # Longitudinal low-income
  - name: INHARMLAGL
    random_numeric:
      distribution: uniform
      min: 1
      max: 300
      round: 0

  # Income vs social minimum (%)
  - name: INHARMSOC
    random_numeric:
      distribution: uniform
      min: 1
      max: 300
      round: 0

  # Longitudinal social minimum
  - name: INHARMSOCL
    random_numeric:
      distribution: uniform
      min: 1
      max: 300
      round: 0

  # Social assistance type
  - name: INHBBIHJ
    random_categorical:
      values: ["00", "01", "02", "03", "04", "05", "99"]
      probs:  [0.70, 0.05, 0.03, 0.02, 0.05, 0.10, 0.05]

  # Taxable household income (not calibrated)
  - name: INHBELIH
    random_numeric:
      distribution: normal
      mean: 18000
      sd: 20000
      min: 0
      round: 0

  # Disposable household income (StatLine 83932NED, per household type)
  - name: INHBESTINKH
    source: spine.pers.BESTINKH

  # Gross household income (derived from disposable income)
  - name: INHBRUTINKH
    source: spine.pers.BRUTINKH

  # Main income earner indicator
  - name: INHEHALGR
    random_categorical:
      values: ["1", "2", "9"]
      probs:  [0.85, 0.10, 0.05]

  # Standardized household income (disposable / equivalence factor)
  - name: INHGESTINKH
    source: spine.pers.GESTINKH

  - name: INHP100HBEST
    source: spine.pers.P100HBEST

  - name: INHP100HBESTES
    source: spine.pers.P100HBEST

  - name: INHP100HBRUT
    source: spine.pers.P100HBRUT

  - name: INHP100HGEST
    source: spine.pers.P100HGEST

  - name: INHP100HGESTES
    source: spine.pers.P100HGEST

  - name: INHP100HPRIM
    source: spine.pers.P100HPRIM

  # Population indicator
  - name: INHPOPIIV
    random_categorical:
      values: ["1", "2"]
      probs:  [0.97, 0.03]
    codelist: popiiv

  # Primary household income (derived from disposable income)
  - name: INHPRIMINKH
    source: spine.pers.PRIMINKH

  # AOW composition
  - name: INHSAMAOW
    random_categorical:
      values: ["01", "02", "03", "04", "05", "06", "99"]
      probs:  [0.15, 0.10, 0.10, 0.05, 0.05, 0.05, 0.50]

  # Household composition
  - name: INHSAMHH
    random_categorical:
      values: ["01", "02", "03", "04", "05", "06", "07", "08"]
      probs:  [0.17, 0.08, 0.10, 0.08, 0.22, 0.08, 0.07, 0.20]
    codelist: samhh

  # UAF indicator
  - name: INHUAF
    random_numeric:
      distribution: uniform
      min: 0
      max: 3
      round: 0

  # Longitudinal UAF
  - name: INHUAFL
    random_numeric:
      distribution: uniform
      min: 0
      max: 3
      round: 0

  # UAF type
  - name: INHUAFTYP
    random_categorical:
      values: ["0", "1", "2", "3"]
      probs:  [0.85, 0.05, 0.05, 0.05]
