# INHATAB column spec
# Household income
# One row per household, annual data
# See: https://www.cbs.nl/nl-nl/onze-diensten/maatwerk-en-microdata/microdata-zelf-onderzoek-doen/microdatabestanden/inhatab-inkomen-van-huishoudens

entity: person
spine_table: pers

columns:
  # Household key (main earner identifies the household)
  - name: RINPERSOONSHKW
    value: "R"
    codelist: rinpersoons

  - name: RINPERSOONHKW
    source: spine.pers.RINPERSOONHKW

  # Household size (members present in the year)
  - name: INHAHL
    source: spine.pers.INHAHL

  # Household members with income
  - name: INHAHLMI
    codes_for: {column: INC_STATUS, values: {U: 99}}
    random_numeric:
      distribution: uniform
      min: 1
      max: 4
      round: 0

  # Income vs European poverty line (%)
  - name: INHARMEUR
    codes_for: {column: INC_STATUS, values: {I: -2, U: -1}}
    random_numeric:
      distribution: uniform
      min: 1
      max: 300
      round: 0

  # Longitudinal European poverty
  - name: INHARMEURL
    codes_for: {column: INC_STATUS, values: {I: -2, U: -1}}
    random_numeric:
      distribution: uniform
      min: 1
      max: 300
      round: 0

  # Income vs low-income threshold (%)
  - name: INHARMLAG
    codes_for: {column: INC_STATUS, values: {I: -2, U: -1}}
    random_numeric:
      distribution: uniform
      min: 1
      max: 300
      round: 0

  # Longitudinal low-income
  - name: INHARMLAGL
    codes_for: {column: INC_STATUS, values: {I: -2, U: -1}}
    random_numeric:
      distribution: uniform
      min: 1
      max: 300
      round: 0

  # Income vs social minimum (%)
  - name: INHARMSOC
    codes_for: {column: INC_STATUS, values: {I: -2, U: -1}}
    random_numeric:
      distribution: uniform
      min: 1
      max: 300
      round: 0

  # Longitudinal social minimum
  - name: INHARMSOCL
    codes_for: {column: INC_STATUS, values: {I: -2, U: -1}}
    random_numeric:
      distribution: uniform
      min: 1
      max: 300
      round: 0

  # Main source of household income
  - name: INHBBIHJ
    codes_for: {column: INC_STATUS, values: {U: "99"}}
    # main income source: 11-14 work, 21-26 benefits and pensions, 30 wealth
    random_categorical:
      values: ["11", "12", "13", "14", "21", "22", "23", "24", "25", "26", "30"]
      probs:  [0.55, 0.02, 0.07, 0.01, 0.01, 0.04, 0.01, 0.03, 0.23, 0.02, 0.01]

  # Taxable household income (not calibrated)
  - name: INHBELIH
    codes_for: {column: INC_STATUS, values: {U: 9999999999.0}}
    random_numeric:
      distribution: normal
      mean: 18000
      sd: 20000
      min: 0
      round: 0

  # Disposable household income (StatLine 83932NED, per household type)
  - name: INHBESTINKH
    codes_for: {column: INC_STATUS, values: {U: 9999999999.0}}
    source: spine.pers.BESTINKH

  # Gross household income (derived from disposable income)
  - name: INHBRUTINKH
    codes_for: {column: INC_STATUS, values: {U: 9999999999.0}}
    source: spine.pers.BRUTINKH

  # Home ownership: 1 own, 2 rent, 3 rent with housing allowance,
  # 8 institutional, 9 unknown
  - name: INHEHALGR
    codes_for: {column: INC_STATUS, values: {I: "8", U: "9"}}
    random_categorical:
      values: ["1", "2", "3"]
      probs:  [0.57, 0.25, 0.18]

  # Standardized household income (disposable / equivalence factor)
  - name: INHGESTINKH
    codes_for: {column: INC_STATUS, values: {U: 9999999999.0}}
    source: spine.pers.GESTINKH

  - name: INHP100HBEST
    codes_for: {column: INC_STATUS, values: {I: -2, U: -1}}
    source: spine.pers.P100HBEST

  - name: INHP100HBESTES
    codes_for: {column: INC_STATUS, values: {I: -2, U: -1}}
    source: spine.pers.P100HBEST

  - name: INHP100HBRUT
    codes_for: {column: INC_STATUS, values: {I: -2, U: -1}}
    source: spine.pers.P100HBRUT

  - name: INHP100HGEST
    codes_for: {column: INC_STATUS, values: {I: -2, U: -1}}
    source: spine.pers.P100HGEST

  - name: INHP100HGESTES
    codes_for: {column: INC_STATUS, values: {I: -2, U: -1}}
    source: spine.pers.P100HGEST

  - name: INHP100HPRIM
    codes_for: {column: INC_STATUS, values: {I: -2, U: -1}}
    source: spine.pers.P100HPRIM

  # Population indicator
  - name: INHPOPIIV
    random_categorical:
      values: ["1", "2"]
      probs:  [0.97, 0.03]
    codelist: popiiv

  # Primary household income (derived from disposable income)
  - name: INHPRIMINKH
    codes_for: {column: INC_STATUS, values: {U: 9999999999.0}}
    source: spine.pers.PRIMINKH

  # AOW composition
  - name: INHSAMAOW
    random_categorical:
      values: ["01", "02", "03", "04", "05", "06", "99"]
      probs:  [0.15, 0.10, 0.10, 0.05, 0.05, 0.05, 0.50]

  # Household composition
  - name: INHSAMHH
    random_categorical:
      values: ["01", "02", "03", "04", "05", "06", "07", "08"]
      probs:  [0.17, 0.08, 0.10, 0.08, 0.22, 0.08, 0.07, 0.20]
    codelist: samhh

  # UAF indicator
  - name: INHUAF
    random_numeric:
      distribution: uniform
      min: 0
      max: 3
      round: 0

  # Longitudinal UAF
  - name: INHUAFL
    random_numeric:
      distribution: uniform
      min: 0
      max: 3
      round: 0

  # UAF type
  - name: INHUAFTYP
    random_categorical:
      values: ["0", "1", "2", "3"]
      probs:  [0.85, 0.05, 0.05, 0.05]
